<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Real VR Spatial Tour — VisionOS Experience — Monastery 360</title>
  <meta name="description" content="Photorealistic 360° WebGL Spherical Virtual Tour with real 3D camera movement, spatial audio, and Apple VisionOS eye-tracking simulation." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <!-- Three.js WebGL 3D Engine & Tween.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <style>
    /* ===== REAL 360 WEBGL SPATIAL STYLES ===== */
    :root {
      --spatial-glass: rgba(12, 12, 24, 0.55);
      --spatial-border: rgba(255, 255, 255, 0.2);
      --spatial-glow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    body {
      user-select: none;
      background: #000;
      overflow: hidden;
    }

    .tour-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - var(--nav-height));
      margin-top: var(--nav-height);
      overflow: hidden;
      position: relative;
    }

    /* SIDEBAR - VISION OS GLASS */
    .tour-sidebar {
      background: var(--spatial-glass);
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border-right: 1px solid var(--spatial-border);
      box-shadow: var(--spatial-glow);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--spatial-border);
      background: rgba(255, 255, 255, 0.03);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .sidebar-header h2 {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--clr-gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-search input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--spatial-border);
      border-radius: 12px;
      padding: 10px 14px 10px 38px;
      color: var(--clr-text);
      font-size: 0.85rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .sidebar-search input:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--clr-gold);
      box-shadow: 0 0 20px rgba(244, 168, 50, 0.3);
    }

    .monastery-list-item {
      display: flex;
      gap: 14px;
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      border: 1px solid transparent;
      margin-bottom: 6px;
    }

    .monastery-list-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: scale(1.02) translateX(4px);
    }

    .monastery-list-item.active {
      background: rgba(244, 168, 50, 0.18);
      border-color: rgba(244, 168, 50, 0.6);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    /* WEBGL 3D CANVAS STAGE */
    .tour-viewer {
      position: relative;
      overflow: hidden;
      background: #000;
      cursor: grab;
      width: 100%;
      height: 100%;
    }

    .tour-viewer:active {
      cursor: grabbing;
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* VISION OS RETICLE */
    .spatial-reticle {
      position: fixed;
      width: 26px;
      height: 26px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(1);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spatial-reticle::after {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--clr-gold);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--clr-gold);
    }

    .spatial-reticle.hovering {
      transform: translate(-50%, -50%) scale(1.8);
      border-color: var(--clr-gold);
      background: rgba(244, 168, 50, 0.25);
    }

    .spatial-reticle.pinching {
      transform: translate(-50%, -50%) scale(0.65);
      background: var(--clr-gold);
    }

    /* 3D SPATIAL PROJECTED PINS */
    .spatial-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 15;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.2s ease, opacity 0.3s ease;
      will-change: transform, left, top;
    }

    .spatial-pin.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .pin-card {
      background: rgba(10, 10, 20, 0.82);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(244, 168, 50, 0.7);
      border-radius: 100px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), 0 0 25px rgba(244, 168, 50, 0.4);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pin-icon {
      width: 28px;
      height: 28px;
      background: var(--grad-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      color: #1a0800;
      box-shadow: 0 0 12px rgba(244, 168, 50, 0.8);
      animation: pulseGlow 2s infinite;
    }

    .spatial-pin:hover .pin-card {
      transform: scale(1.15);
      background: rgba(244, 168, 50, 0.3);
      border-color: #fff;
      box-shadow: 0 0 35px rgba(244, 168, 50, 0.7);
    }

    /* FLOATING HUD OVERLAY */
    .hud-header {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: var(--spatial-glass);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--spatial-border);
      border-radius: 100px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--spatial-glow);
    }

    .hud-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--clr-heading);
      letter-spacing: 0.05em;
    }

    .hud-tag {
      background: rgba(244, 168, 50, 0.25);
      border: 1px solid rgba(244, 168, 50, 0.5);
      color: var(--clr-gold);
      padding: 3px 12px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* WALKING MOVEMENT CONTROLS (D-PAD) */
    .walk-controls-overlay {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 30;
      background: var(--spatial-glass);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--spatial-border);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--spatial-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .walk-dpad-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--clr-gold);
      margin-bottom: 4px;
    }

    .walk-btn {
      width: 48px;
      height: 44px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--spatial-border);
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .walk-btn:hover {
      background: rgba(244, 168, 50, 0.3);
      border-color: var(--clr-gold);
      transform: scale(1.1);
    }

    .walk-row { display: flex; gap: 8px; }

    /* BOTTOM CONTROL CAPSULE BAR */
    .spatial-control-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: var(--spatial-glass);
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--spatial-border);
      border-radius: 100px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--spatial-glow);
    }

    .spatial-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--spatial-border);
      color: #fff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .spatial-btn:hover {
      background: rgba(244, 168, 50, 0.35);
      border-color: var(--clr-gold);
      transform: scale(1.15);
      box-shadow: 0 0 25px rgba(244, 168, 50, 0.5);
    }

    .spatial-btn.active {
      background: var(--grad-gold);
      color: #1a0800;
      border-color: #fff;
      box-shadow: 0 0 30px rgba(244, 168, 50, 0.7);
    }

    /* SPATIAL INFO MODAL */
    .spatial-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      width: 440px;
      max-width: 90%;
      background: var(--spatial-glass);
      backdrop-filter: blur(45px) saturate(220%);
      -webkit-backdrop-filter: blur(45px) saturate(220%);
      border: 1px solid var(--spatial-border);
      border-radius: 28px;
      box-shadow: var(--spatial-glow), 0 35px 90px rgba(0, 0, 0, 0.85);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .spatial-modal.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: all;
    }

    .spatial-modal-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .spatial-modal-body { padding: 24px; }

    .spatial-modal-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .spatial-modal-desc {
      font-size: 0.9rem;
      color: var(--clr-text-muted);
      line-height: 1.65;
      margin-bottom: 20px;
    }

    /* SCENE SELECTION TABS */
    .scene-tabs {
      position: absolute;
      top: 90px;
      left: 24px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scene-tab {
      background: var(--spatial-glass);
      backdrop-filter: blur(25px);
      border: 1px solid var(--spatial-border);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--clr-text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .scene-tab.active, .scene-tab:hover {
      background: rgba(244, 168, 50, 0.25);
      border-color: var(--clr-gold);
      color: var(--clr-gold);
      box-shadow: 0 0 20px rgba(244, 168, 50, 0.3);
    }

    @media (max-width: 768px) {
      .tour-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .tour-sidebar { height: 220px; }
      .hud-header { width: 90%; justify-content: center; }
      .walk-controls-overlay { bottom: 85px; right: 16px; transform: scale(0.85); transform-origin: bottom right; }
    }
  </style>
</head>
<body>

  <!-- SPATIAL RETICLE (APPLE VISION PRO CURSOR) -->
  <div class="spatial-reticle" id="spatial-reticle" aria-hidden="true"></div>

  <!-- NAVBAR -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">🏯</div>
        <div class="nav-logo-text">
          <span class="nav-logo-name">Monastery 360</span>
          <span class="nav-logo-tagline">Real WebGL 360° VR</span>
        </div>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="tour.html" class="nav-link active">Virtual Tour</a>
        <a href="monasteries.html" class="nav-link">Monasteries</a>
        <a href="archive.html" class="nav-link">Archive</a>
        <a href="calendar.html" class="nav-link">Calendar</a>
        <a href="map.html" class="nav-link">Map</a>
        <a href="guide.html" class="nav-link nav-cta">🎙️ Audio Guide</a>
      </div>
      <button class="nav-hamburger" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <!-- SPATIAL TOUR LAYOUT -->
  <div class="tour-layout">

    <!-- SIDEBAR -->
    <aside class="tour-sidebar" aria-label="Monastery Selector">
      <div class="sidebar-header">
        <h2>👓 Spatial VR Sanctuaries</h2>
        <div class="sidebar-search" style="margin-top:12px">
          <input type="text" id="monastery-search" placeholder="Search sanctuary..." aria-label="Search monasteries" />
        </div>
      </div>
      <div class="monastery-list" id="monastery-list" role="listbox"></div>
    </aside>

    <!-- 3D THREE.JS WEBGL CANVAS STAGE -->
    <main class="tour-viewer" id="tour-viewer" aria-label="Real WebGL 360° VR Experience">

      <!-- THREE.JS WEBGL CANVAS -->
      <canvas id="webgl-canvas"></canvas>

      <!-- FLOATING HUD -->
      <div class="hud-header">
        <span class="hud-tag">🥽 360° Real VR</span>
        <span class="hud-title" id="monastery-name">Rumtek Monastery</span>
        <div class="sound-badge" style="display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--clr-gold)">
          <span style="width:8px;height:8px;background:var(--clr-gold);border-radius:50%;animation:pulseGlow 1.5s infinite"></span>
          <span id="spatial-sound-status">Spatial Audio Active</span>
        </div>
      </div>

      <!-- 3D SPATIAL PROJECTED PINS CONTAINER -->
      <div id="spatial-pins-container"></div>

      <!-- SCENE LOCATION TABS -->
      <div class="scene-tabs" id="scene-tabs"></div>

      <!-- WALKING MOVEMENT CONTROLS (D-PAD) -->
      <div class="walk-controls-overlay">
        <span class="walk-dpad-title">Walk Controls</span>
        <button class="walk-btn" id="walk-forward" title="Step Forward (W / Up)">⬆️</button>
        <div class="walk-row">
          <button class="walk-btn" id="walk-left" title="Turn Left (A / Left)">⬅️</button>
          <button class="walk-btn" id="walk-backward" title="Step Back (S / Down)">⬇️</button>
          <button class="walk-btn" id="walk-right" title="Turn Right (D / Right)">➡️</button>
        </div>
      </div>

      <!-- BOTTOM SPATIAL CONTROL BAR -->
      <div class="spatial-control-bar" role="toolbar">
        <button class="spatial-btn" id="ctrl-walk" title="Auto Walk Mode">🚶‍♂️</button>
        <button class="spatial-btn" id="ctrl-audio" title="Toggle Spatial Audio">🔊</button>
        <div class="tour-divider"></div>
        <button class="spatial-btn" id="ctrl-zoom-in" title="Zoom In">🔍+</button>
        <button class="spatial-btn" id="ctrl-zoom-out" title="Zoom Out">🔍−</button>
        <button class="spatial-btn" id="ctrl-reset" title="Reset VR Camera">🔄</button>
        <div class="tour-divider"></div>
        <button class="spatial-btn" id="ctrl-fullscreen" title="Enter Immersive Fullscreen">⛶</button>
      </div>

      <!-- SPATIAL GLASS MODAL -->
      <div class="spatial-modal" id="info-panel" role="dialog">
        <img src="" alt="" id="info-panel-img" class="spatial-modal-img" />
        <div class="spatial-modal-body">
          <p class="card-label" id="info-panel-type" style="color:var(--clr-gold);font-size:0.75rem;text-transform:uppercase">Point of Interest</p>
          <h3 class="spatial-modal-title" id="info-panel-title">Location Title</h3>
          <p class="spatial-modal-desc" id="info-panel-desc">Description</p>
          <div style="display:flex; gap:12px; margin-top:16px;">
            <a href="guide.html" class="btn btn-primary btn-sm">🎙️ Audio Guide</a>
            <button class="btn btn-outline btn-sm" id="info-panel-close">Close</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/tour.js"></script>
</body>
</html>
