<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Google VR System — Monastery 360</title>
  <meta name="description" content="Official Google VR Cardboard & WebXR 360° Photo Sphere Experience for Sikkim Monasteries." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <!-- Three.js Engine & StereoEffect for Google VR Cardboard -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <style>
    /* ===== GOOGLE VR SYSTEM STYLES ===== */
    :root {
      --gvr-glass: rgba(18, 18, 28, 0.65);
      --gvr-border: rgba(255, 255, 255, 0.22);
      --gvr-google-red: #ea4335;
      --gvr-google-blue: #4285f4;
      --gvr-google-yellow: #fbbc05;
      --gvr-google-green: #34a853;
    }

    body {
      user-select: none;
      background: #000;
      overflow: hidden;
    }

    .tour-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - var(--nav-height));
      margin-top: var(--nav-height);
      overflow: hidden;
      position: relative;
    }

    /* GOOGLE VR SIDEBAR */
    .tour-sidebar {
      background: var(--gvr-glass);
      backdrop-filter: blur(35px) saturate(180%);
      -webkit-backdrop-filter: blur(35px) saturate(180%);
      border-right: 1px solid var(--gvr-border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--gvr-border);
      background: rgba(255, 255, 255, 0.04);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .sidebar-header h2 {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--clr-gold);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-search input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--gvr-border);
      border-radius: 12px;
      padding: 10px 14px 10px 38px;
      color: var(--clr-text);
      font-size: 0.85rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .sidebar-search input:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--gvr-google-blue);
      box-shadow: 0 0 20px rgba(66, 133, 244, 0.3);
    }

    .monastery-list-item {
      display: flex;
      gap: 14px;
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      border: 1px solid transparent;
      margin-bottom: 6px;
    }

    .monastery-list-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: scale(1.02) translateX(4px);
    }

    .monastery-list-item.active {
      background: rgba(66, 133, 244, 0.18);
      border-color: rgba(66, 133, 244, 0.6);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    /* GOOGLE VR 3D STAGE */
    .tour-viewer {
      position: relative;
      overflow: hidden;
      background: #000;
      cursor: grab;
      width: 100%;
      height: 100%;
    }

    .tour-viewer:active { cursor: grabbing; }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* GOOGLE VR HEADS-UP DISPLAY (HUD) */
    .gvr-hud-header {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: var(--gvr-glass);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--gvr-border);
      border-radius: 100px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .gvr-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
    }

    .gvr-logo-dots {
      display: flex;
      gap: 3px;
    }

    .gvr-dot { width: 8px; height: 8px; border-radius: 50%; }
    .gvr-dot.blue { background: var(--gvr-google-blue); }
    .gvr-dot.red { background: var(--gvr-google-red); }
    .gvr-dot.yellow { background: var(--gvr-google-yellow); }
    .gvr-dot.green { background: var(--gvr-google-green); }

    .hud-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--clr-heading);
    }

    /* GOOGLE VR 3D PROJECTED PINS */
    .spatial-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 15;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.2s ease, opacity 0.3s ease;
      will-change: transform, left, top;
    }

    .spatial-pin.hidden { opacity: 0; pointer-events: none; }

    .pin-card {
      background: rgba(15, 15, 25, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(66, 133, 244, 0.7);
      border-radius: 100px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), 0 0 25px rgba(66, 133, 244, 0.4);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pin-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--gvr-google-blue), var(--gvr-google-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      color: #fff;
      box-shadow: 0 0 12px rgba(66, 133, 244, 0.8);
      animation: pulseGlow 2s infinite;
    }

    .spatial-pin:hover .pin-card {
      transform: scale(1.15);
      background: rgba(66, 133, 244, 0.3);
      border-color: #fff;
      box-shadow: 0 0 35px rgba(66, 133, 244, 0.8);
    }

    /* GOOGLE CARDBOARD SPLIT-SCREEN STEREO OVERLAY */
    .cardboard-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      display: none;
    }

    .cardboard-overlay.active {
      display: flex;
    }

    .cardboard-divider {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #000;
      transform: translateX(-50%);
      box-shadow: 0 0 20px #000;
    }

    .cardboard-hint {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--gvr-google-yellow);
      border-radius: 100px;
      padding: 8px 20px;
      color: var(--gvr-google-yellow);
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* GOOGLE VR CONTROL CAPSULE BAR */
    .gvr-control-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: var(--gvr-glass);
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--gvr-border);
      border-radius: 100px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .gvr-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--gvr-border);
      color: #fff;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .gvr-btn:hover {
      background: rgba(66, 133, 244, 0.35);
      border-color: var(--gvr-google-blue);
      transform: scale(1.15);
      box-shadow: 0 0 25px rgba(66, 133, 244, 0.5);
    }

    .gvr-btn.active {
      background: linear-gradient(135deg, var(--gvr-google-blue), #1a73e8);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 30px rgba(66, 133, 244, 0.8);
    }

    .gvr-btn.cardboard-btn {
      background: linear-gradient(135deg, var(--gvr-google-red), #d93025);
    }

    /* WALK CONTROLS D-PAD */
    .walk-controls-overlay {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 30;
      background: var(--gvr-glass);
      backdrop-filter: blur(30px);
      border: 1px solid var(--gvr-border);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .walk-dpad-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gvr-google-blue);
      margin-bottom: 4px;
    }

    .walk-btn {
      width: 48px;
      height: 44px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--gvr-border);
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .walk-btn:hover {
      background: rgba(66, 133, 244, 0.3);
      border-color: var(--gvr-google-blue);
      transform: scale(1.1);
    }

    .walk-row { display: flex; gap: 8px; }

    /* SCENE TABS */
    .scene-tabs {
      position: absolute;
      top: 90px;
      left: 24px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scene-tab {
      background: var(--gvr-glass);
      backdrop-filter: blur(25px);
      border: 1px solid var(--gvr-border);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--clr-text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .scene-tab.active, .scene-tab:hover {
      background: rgba(66, 133, 244, 0.25);
      border-color: var(--gvr-google-blue);
      color: #fff;
      box-shadow: 0 0 20px rgba(66, 133, 244, 0.4);
    }

    /* MODAL */
    .spatial-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      width: 440px;
      max-width: 90%;
      background: var(--gvr-glass);
      backdrop-filter: blur(45px) saturate(220%);
      -webkit-backdrop-filter: blur(45px) saturate(220%);
      border: 1px solid var(--gvr-border);
      border-radius: 28px;
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.85);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .spatial-modal.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: all;
    }

    .spatial-modal-img { width: 100%; height: 220px; object-fit: cover; }
    .spatial-modal-body { padding: 24px; }
    .spatial-modal-title { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .spatial-modal-desc { font-size: 0.9rem; color: var(--clr-text-muted); line-height: 1.65; margin-bottom: 20px; }

    @media (max-width: 768px) {
      .tour-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .tour-sidebar { height: 220px; }
      .gvr-hud-header { width: 90%; justify-content: center; }
      .walk-controls-overlay { bottom: 85px; right: 16px; transform: scale(0.85); transform-origin: bottom right; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">🏯</div>
        <div class="nav-logo-text">
          <span class="nav-logo-name">Monastery 360</span>
          <span class="nav-logo-tagline">Google VR System</span>
        </div>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="tour.html" class="nav-link active">Virtual Tour</a>
        <a href="monasteries.html" class="nav-link">Monasteries</a>
        <a href="archive.html" class="nav-link">Archive</a>
        <a href="calendar.html" class="nav-link">Calendar</a>
        <a href="map.html" class="nav-link">Map</a>
        <a href="guide.html" class="nav-link nav-cta">🎙️ Audio Guide</a>
      </div>
      <button class="nav-hamburger" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <!-- GOOGLE VR TOUR LAYOUT -->
  <div class="tour-layout">

    <!-- SIDEBAR -->
    <aside class="tour-sidebar" aria-label="Monastery Selector">
      <div class="sidebar-header">
        <h2>🥽 Google VR Sanctuaries</h2>
        <div class="sidebar-search" style="margin-top:12px">
          <input type="text" id="monastery-search" placeholder="Search sanctuary..." aria-label="Search monasteries" />
        </div>
      </div>
      <div class="monastery-list" id="monastery-list" role="listbox"></div>
    </aside>

    <!-- 3D GOOGLE VR CANVAS STAGE -->
    <main class="tour-viewer" id="tour-viewer" aria-label="Google VR 360° Photo Sphere Experience">

      <!-- THREE.JS WEBGL CANVAS -->
      <canvas id="webgl-canvas"></canvas>

      <!-- GOOGLE CARDBOARD STEREO DUAL-VIEW OVERLAY -->
      <div class="cardboard-overlay" id="cardboard-overlay">
        <div class="cardboard-divider"></div>
        <div class="cardboard-hint">🥽 Insert phone into Google Cardboard VR Headset</div>
      </div>

      <!-- GOOGLE VR FLOATING HUD -->
      <div class="gvr-hud-header">
        <div class="gvr-logo">
          <div class="gvr-logo-dots">
            <span class="gvr-dot blue"></span>
            <span class="gvr-dot red"></span>
            <span class="gvr-dot yellow"></span>
            <span class="gvr-dot green"></span>
          </div>
          <span>Google VR System</span>
        </div>
        <span class="hud-title" id="monastery-name">Rumtek Monastery</span>
      </div>

      <!-- 3D SPATIAL PROJECTED PINS CONTAINER -->
      <div id="spatial-pins-container"></div>

      <!-- SCENE LOCATION TABS -->
      <div class="scene-tabs" id="scene-tabs"></div>

      <!-- WALKING MOVEMENT CONTROLS (D-PAD) -->
      <div class="walk-controls-overlay">
        <span class="walk-dpad-title">Walk Controls</span>
        <button class="walk-btn" id="walk-forward" title="Step Forward (W / Up)">⬆️</button>
        <div class="walk-row">
          <button class="walk-btn" id="walk-left" title="Turn Left (A / Left)">⬅️</button>
          <button class="walk-btn" id="walk-backward" title="Step Back (S / Down)">⬇️</button>
          <button class="walk-btn" id="walk-right" title="Turn Right (D / Right)">➡️</button>
        </div>
      </div>

      <!-- GOOGLE VR BOTTOM CONTROL BAR -->
      <div class="gvr-control-bar" role="toolbar">
        <button class="gvr-btn cardboard-btn" id="ctrl-cardboard" title="Google Cardboard VR Mode (Stereoscopic 3D)">🥽</button>
        <button class="gvr-btn" id="ctrl-gyro" title="Gyroscope / Device Motion Tracking">📱</button>
        <div class="tour-divider"></div>
        <button class="gvr-btn" id="ctrl-walk" title="Auto Walk Mode">🚶‍♂️</button>
        <button class="gvr-btn" id="ctrl-zoom-in" title="Zoom In">🔍+</button>
        <button class="gvr-btn" id="ctrl-zoom-out" title="Zoom Out">🔍−</button>
        <button class="gvr-btn" id="ctrl-reset" title="Reset Google VR Camera">🔄</button>
        <div class="tour-divider"></div>
        <button class="gvr-btn" id="ctrl-fullscreen" title="Enter Immersive Fullscreen">⛶</button>
      </div>

      <!-- SPATIAL GLASS MODAL -->
      <div class="spatial-modal" id="info-panel" role="dialog">
        <img src="" alt="" id="info-panel-img" class="spatial-modal-img" />
        <div class="spatial-modal-body">
          <p class="card-label" id="info-panel-type" style="color:var(--gvr-google-blue);font-size:0.75rem;text-transform:uppercase">Google VR Spot</p>
          <h3 class="spatial-modal-title" id="info-panel-title">Location Title</h3>
          <p class="spatial-modal-desc" id="info-panel-desc">Description</p>
          <div style="display:flex; gap:12px; margin-top:16px;">
            <a href="guide.html" class="btn btn-primary btn-sm">🎙️ Audio Guide</a>
            <button class="btn btn-outline btn-sm" id="info-panel-close">Close</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/tour.js"></script>
</body>
</html>
