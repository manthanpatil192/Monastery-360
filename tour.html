<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Google VR Goggle Experience — Monastery 360</title>
  <meta name="description" content="Official Google Maps & Google VR Style 360° Photo Sphere Experience with mouse cursor camera tracking." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <!-- Three.js Engine, StereoEffect, WebXR & Tween.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <style>
    /* ===== GOOGLE VR GOGGLE SYSTEM STYLES (SIH WHITE THEME) ===== */
    :root {
      --gvr-white: #ffffff;
      --gvr-bg: #f8f9fa;
      --gvr-border: rgba(0, 0, 0, 0.08);
      --gvr-blue: #4285f4;
      --gvr-red: #ea4335;
      --gvr-yellow: #fbbc05;
      --gvr-green: #34a853;
      --gvr-dark: #0f172a;
    }

    body {
      user-select: none;
      background: var(--gvr-bg);
      overflow: hidden;
    }

    .tour-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - var(--nav-height));
      margin-top: var(--nav-height);
      overflow: hidden;
      position: relative;
    }

    /* GOOGLE VR SIDEBAR */
    .tour-sidebar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border-right: 1px solid var(--gvr-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--gvr-border);
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .sidebar-header h2 {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--gvr-blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-search input {
      width: 100%;
      background: #f1f3f5;
      border: 1px solid var(--gvr-border);
      border-radius: 12px;
      padding: 10px 14px 10px 38px;
      color: var(--gvr-dark);
      font-size: 0.85rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .sidebar-search input:focus {
      background: #ffffff;
      border-color: var(--gvr-blue);
      box-shadow: 0 0 15px rgba(66, 133, 244, 0.25);
    }

    .monastery-list-item {
      display: flex;
      gap: 14px;
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      border: 1px solid transparent;
      margin-bottom: 6px;
    }

    .monastery-list-item:hover {
      background: #f1f3f5;
      border-color: rgba(0, 0, 0, 0.08);
      transform: scale(1.02) translateX(4px);
    }

    .monastery-list-item.active {
      background: rgba(66, 133, 244, 0.1);
      border-color: var(--gvr-blue);
      box-shadow: 0 4px 15px rgba(66, 133, 244, 0.2);
    }

    .monastery-list-item-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gvr-dark);
    }

    .monastery-list-item-sub {
      font-size: 0.72rem;
      color: #64748b;
    }

    /* WEBGL 3D STAGE */
    .tour-viewer {
      position: relative;
      overflow: hidden;
      background: #000;
      cursor: default;
      width: 100%;
      height: 100%;
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* GOOGLE VR STREET VIEW HUD OVERLAY */
    .gvr-hud-header {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--gvr-border);
      border-radius: 100px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .gvr-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--gvr-dark);
    }

    .gvr-dots {
      display: flex;
      gap: 3px;
    }

    .gvr-dot { width: 8px; height: 8px; border-radius: 50%; }
    .gvr-dot.blue { background: var(--gvr-blue); }
    .gvr-dot.red { background: var(--gvr-red); }
    .gvr-dot.yellow { background: var(--gvr-yellow); }
    .gvr-dot.green { background: var(--gvr-green); }

    .hud-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--gvr-dark);
    }

    /* GOOGLE STREET VIEW CAROUSEL STRIP */
    .gvr-carousel-strip {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(25px);
      border: 1px solid var(--gvr-border);
      border-radius: 100px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      max-width: 90%;
      overflow-x: auto;
    }

    .gvr-carousel-thumb {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #f1f3f5;
      border: 1px solid var(--gvr-border);
      border-radius: 100px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--gvr-dark);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .gvr-carousel-thumb:hover, .gvr-carousel-thumb.active {
      background: var(--gvr-blue);
      color: #ffffff;
      border-color: var(--gvr-blue);
      box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
    }

    /* 3D PROJECTED SPATIAL PINS */
    .spatial-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 15;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.2s ease, opacity 0.3s ease;
      will-change: transform, left, top;
    }

    .spatial-pin.hidden { opacity: 0; pointer-events: none; }

    .pin-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--gvr-blue);
      border-radius: 100px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15), 0 0 15px rgba(66, 133, 244, 0.3);
      color: var(--gvr-dark);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pin-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--gvr-blue), var(--gvr-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(66, 133, 244, 0.6);
      animation: pulseGlow 2s infinite;
    }

    .spatial-pin:hover .pin-card {
      transform: scale(1.15);
      background: #ffffff;
      border-color: var(--gvr-blue);
      box-shadow: 0 0 30px rgba(66, 133, 244, 0.6);
    }

    /* GOOGLE CARDBOARD STEREO DUAL-VIEW OVERLAY */
    .cardboard-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      display: none;
    }

    .cardboard-overlay.active { display: flex; }

    .cardboard-divider {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #000;
      transform: translateX(-50%);
    }

    .cardboard-hint {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--gvr-blue);
      border-radius: 100px;
      padding: 8px 20px;
      color: var(--gvr-blue);
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* GROUND WALK D-PAD CONTROLS */
    .walk-controls-overlay {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 30;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(30px);
      border: 1px solid var(--gvr-border);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .walk-dpad-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gvr-blue);
      margin-bottom: 4px;
    }

    .walk-btn {
      width: 48px;
      height: 44px;
      background: #f1f3f5;
      border: 1px solid var(--gvr-border);
      border-radius: 12px;
      color: var(--gvr-dark);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .walk-btn:hover {
      background: rgba(66, 133, 244, 0.15);
      border-color: var(--gvr-blue);
      transform: scale(1.1);
    }

    .walk-row { display: flex; gap: 8px; }

    /* GOOGLE VR CONTROL CAPSULE BAR */
    .gvr-control-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid var(--gvr-border);
      border-radius: 100px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .gvr-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #f1f3f5;
      border: 1px solid var(--gvr-border);
      color: var(--gvr-dark);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .gvr-btn:hover {
      background: rgba(66, 133, 244, 0.15);
      border-color: var(--gvr-blue);
      transform: scale(1.15);
      box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
    }

    .gvr-btn.active {
      background: var(--gvr-blue);
      color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 4px 20px rgba(66, 133, 244, 0.5);
    }

    .gvr-btn.cardboard-btn {
      background: linear-gradient(135deg, var(--gvr-red), #c0392b);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(234, 67, 53, 0.4);
    }

    /* SPATIAL MODAL */
    .spatial-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      width: 440px;
      max-width: 90%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(45px);
      -webkit-backdrop-filter: blur(45px);
      border: 1px solid var(--gvr-border);
      border-radius: 28px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .spatial-modal.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: all;
    }

    .spatial-modal-img { width: 100%; height: 220px; object-fit: cover; }
    .spatial-modal-body { padding: 24px; }
    .spatial-modal-title { font-size: 1.4rem; font-weight: 700; color: var(--gvr-dark); margin-bottom: 8px; }
    .spatial-modal-desc { font-size: 0.9rem; color: #64748b; line-height: 1.65; margin-bottom: 20px; }

    @media (max-width: 768px) {
      .tour-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .tour-sidebar { height: 220px; }
      .gvr-hud-header { width: 90%; justify-content: center; }
      .gvr-carousel-strip { bottom: 75px; }
      .walk-controls-overlay { bottom: 85px; right: 16px; transform: scale(0.85); transform-origin: bottom right; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">🏯</div>
        <div class="nav-logo-text">
          <span class="nav-logo-name">Monastery 360</span>
          <span class="nav-logo-tagline">Google VR System</span>
        </div>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="tour.html" class="nav-link active">Virtual Tour</a>
        <a href="monasteries.html" class="nav-link">Monasteries</a>
        <a href="archive.html" class="nav-link">Archive</a>
        <a href="calendar.html" class="nav-link">Calendar</a>
        <a href="map.html" class="nav-link">Map</a>
        <a href="guide.html" class="nav-link nav-cta">🎙️ Audio Guide</a>
      </div>
      <button class="nav-hamburger" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <!-- GOOGLE VR TOUR LAYOUT -->
  <div class="tour-layout">

    <!-- SIDEBAR -->
    <aside class="tour-sidebar" aria-label="Monastery Selector">
      <div class="sidebar-header">
        <h2>🥽 Google VR Sanctuaries</h2>
        <div class="sidebar-search" style="margin-top:12px">
          <input type="text" id="monastery-search" placeholder="Search sanctuary..." aria-label="Search monasteries" />
        </div>
      </div>
      <div class="monastery-list" id="monastery-list" role="listbox"></div>
    </aside>

    <!-- 3D WEBGL STAGE -->
    <main class="tour-viewer" id="tour-viewer" aria-label="Google VR 360° Photo Sphere Experience">

      <!-- THREE.JS WEBGL CANVAS -->
      <canvas id="webgl-canvas"></canvas>

      <!-- GOOGLE CARDBOARD STEREO DUAL-VIEW OVERLAY -->
      <div class="cardboard-overlay" id="cardboard-overlay">
        <div class="cardboard-divider"></div>
        <div class="cardboard-hint">🥽 Insert phone into Google Cardboard VR Goggles</div>
      </div>

      <!-- GOOGLE VR HUD OVERLAY -->
      <div class="gvr-hud-header">
        <div class="gvr-badge">
          <div class="gvr-dots">
            <span class="gvr-dot blue"></span>
            <span class="gvr-dot red"></span>
            <span class="gvr-dot yellow"></span>
            <span class="gvr-dot green"></span>
          </div>
          <span>Google VR System</span>
        </div>
        <span class="hud-title" id="monastery-name">Rumtek Monastery</span>
      </div>

      <!-- GOOGLE STREET VIEW PHOTO SPHERE CAROUSEL STRIP -->
      <div class="gvr-carousel-strip" id="scene-carousel"></div>

      <!-- 3D SPATIAL PROJECTED PINS CONTAINER -->
      <div id="spatial-pins-container"></div>

      <!-- WALKING MOVEMENT CONTROLS (D-PAD) -->
      <div class="walk-controls-overlay">
        <span class="walk-dpad-title">Walk on Ground</span>
        <button class="walk-btn" id="walk-forward" title="Step Forward (W / Up)">⬆️</button>
        <div class="walk-row">
          <button class="walk-btn" id="walk-left" title="Turn Left (A / Left)">⬅️</button>
          <button class="walk-btn" id="walk-backward" title="Step Back (S / Down)">⬇️</button>
          <button class="walk-btn" id="walk-right" title="Turn Right (D / Right)">➡️</button>
        </div>
      </div>

      <!-- GOOGLE VR CONTROL CAPSULE BAR -->
      <div class="gvr-control-bar" role="toolbar">
        <button class="gvr-btn cardboard-btn" id="ctrl-cardboard" title="Google Cardboard VR 3D Mode">🥽</button>
        <button class="gvr-btn active" id="ctrl-cursor" title="Mouse Cursor Camera Tracking (Camera moves with laptop mouse cursor)">🖱️</button>
        <button class="gvr-btn" id="ctrl-gyro" title="Gyroscope / Device Motion Head Tracking">📱</button>
        <div class="tour-divider"></div>
        <button class="gvr-btn" id="ctrl-walk" title="Auto Walk Mode">🚶‍♂️</button>
        <button class="gvr-btn" id="ctrl-zoom-in" title="Zoom In">🔍+</button>
        <button class="gvr-btn" id="ctrl-zoom-out" title="Zoom Out">🔍−</button>
        <button class="gvr-btn" id="ctrl-reset" title="Reset Google VR Camera">🔄</button>
        <div class="tour-divider"></div>
        <button class="gvr-btn" id="ctrl-fullscreen" title="Enter Immersive Fullscreen">⛶</button>
      </div>

      <!-- SPATIAL GLASS MODAL -->
      <div class="spatial-modal" id="info-panel" role="dialog">
        <img src="" alt="" id="info-panel-img" class="spatial-modal-img" />
        <div class="spatial-modal-body">
          <p class="card-label" id="info-panel-type" style="color:var(--gvr-blue);font-size:0.75rem;text-transform:uppercase">Google VR Photo Sphere</p>
          <h3 class="spatial-modal-title" id="info-panel-title">Location Title</h3>
          <p class="spatial-modal-desc" id="info-panel-desc">Description</p>
          <div style="display:flex; gap:12px; margin-top:16px;">
            <a href="guide.html" class="btn btn-primary btn-sm">🎙️ Audio Guide</a>
            <button class="btn btn-outline btn-sm" id="info-panel-close">Close</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/tour.js"></script>
</body>
</html>
