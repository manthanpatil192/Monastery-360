<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Map — Monastery 360</title>
  <meta name="description" content="Explore all monasteries of Sikkim on an interactive map. Find locations, get directions, and plan your visit." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .map-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - var(--nav-height));
      margin-top: var(--nav-height);
      overflow: hidden;
    }

    /* MAP SIDEBAR */
    .map-sidebar {
      background: var(--clr-bg-2);
      border-right: 1px solid var(--clr-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .map-sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--clr-border);
      background: var(--clr-bg-3);
    }

    .map-sidebar-header h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .map-search {
      position: relative;
    }

    .map-search input {
      width: 100%;
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: 10px;
      padding: 9px 14px 9px 36px;
      color: var(--clr-text);
      font-size: 0.85rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color var(--transition-fast);
    }

    .map-search input:focus { border-color: rgba(244,168,50,0.4); }
    .map-search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; opacity: 0.5; }

    .map-sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .map-sidebar-list::-webkit-scrollbar { width: 4px; }
    .map-sidebar-list::-webkit-scrollbar-thumb { background: var(--clr-gold-dark); }

    .map-list-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all var(--transition-fast);
      margin-bottom: 6px;
      border: 1px solid transparent;
    }

    .map-list-item:hover {
      background: var(--clr-surface);
    }

    .map-list-item.active {
      background: rgba(244,168,50,0.08);
      border-color: rgba(244,168,50,0.3);
    }

    .map-list-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .map-list-info { flex: 1; min-width: 0; }

    .map-list-name {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--clr-heading);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-list-meta {
      font-size: 0.75rem;
      color: var(--clr-text-muted);
    }

    /* MAP CONTAINER */
    .map-container {
      position: relative;
      flex: 1;
    }

    #leaflet-map {
      width: 100%;
      height: 100%;
      background: #0d0d1a;
    }

    /* Leaflet overrides */
    .leaflet-container {
      font-family: var(--font-body);
    }

    .leaflet-tile {
      filter: brightness(0.7) hue-rotate(200deg) saturate(0.6) contrast(1.1);
    }

    /* Custom popup */
    .leaflet-popup-content-wrapper {
      background: var(--clr-bg-2) !important;
      border: 1px solid var(--clr-border) !important;
      border-radius: 16px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
      padding: 0 !important;
      overflow: hidden;
    }

    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button { color: var(--clr-text-muted) !important; top: 10px !important; right: 12px !important; font-size: 1.2rem !important; }
    .leaflet-popup-close-button:hover { color: var(--clr-gold) !important; }

    .map-popup {
      width: 260px;
      overflow: hidden;
    }

    .map-popup-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .map-popup-body {
      padding: 16px;
    }

    .map-popup-type {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--clr-gold);
      margin-bottom: 4px;
    }

    .map-popup-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--clr-heading);
      margin-bottom: 6px;
    }

    .map-popup-meta {
      font-size: 0.78rem;
      color: var(--clr-text-muted);
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .map-popup-actions {
      display: flex;
      gap: 8px;
    }

    .map-popup-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      border: none;
      font-family: var(--font-body);
      text-decoration: none;
      display: block;
    }

    .map-popup-btn-primary {
      background: var(--grad-gold);
      color: #1a0800;
    }

    .map-popup-btn-secondary {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      color: var(--clr-text);
    }

    /* MAP CONTROLS */
    .map-controls-overlay {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .map-ctrl-btn {
      width: 44px;
      height: 44px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--clr-text);
      font-size: 1.1rem;
      transition: all var(--transition-fast);
    }

    .map-ctrl-btn:hover {
      background: rgba(244,168,50,0.15);
      border-color: rgba(244,168,50,0.4);
      color: var(--clr-gold);
    }

    /* STATS PILL */
    .map-stats-pill {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 500;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: 100px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .map-stat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--clr-text-muted);
    }

    .map-stat strong { color: var(--clr-gold); }

    /* Custom marker */
    .custom-marker {
      background: none;
      border: none;
    }

    .marker-pin {
      width: 36px;
      height: 36px;
      background: var(--grad-gold);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(244,168,50,0.4);
      transition: transform 0.2s;
    }

    .marker-pin:hover { transform: rotate(-45deg) scale(1.15); }
    .marker-icon { transform: rotate(45deg); font-size: 1rem; }

    @media (max-width: 768px) {
      .map-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
      .map-sidebar { height: 280px; border-right: none; border-bottom: 1px solid var(--clr-border); }
      .map-container { height: 60vh; min-height: 400px; }
    }
  </style>
</head>
<body>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">🏯</div>
        <div class="nav-logo-text">
          <span class="nav-logo-name">Monastery 360</span>
          <span class="nav-logo-tagline">Digital Heritage of Sikkim</span>
        </div>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="tour.html" class="nav-link">Virtual Tour</a>
        <a href="monasteries.html" class="nav-link">Monasteries</a>
        <a href="archive.html" class="nav-link">Archive</a>
        <a href="calendar.html" class="nav-link">Calendar</a>
        <a href="map.html" class="nav-link active">Map</a>
        <a href="guide.html" class="nav-link nav-cta">🎙️ Audio Guide</a>
      </div>
      <button class="nav-hamburger" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="map-layout">
    <!-- SIDEBAR -->
    <aside class="map-sidebar" aria-label="Monastery location list">
      <div class="map-sidebar-header">
        <h2>📍 Monasteries on Map</h2>
        <div class="map-search">
          <span class="map-search-icon">🔍</span>
          <input type="text" id="map-search" placeholder="Search location..." aria-label="Search monasteries" />
        </div>
      </div>
      <div class="map-sidebar-list" id="map-list" role="list"></div>
    </aside>

    <!-- MAP -->
    <div class="map-container" aria-label="Interactive map of Sikkim monasteries">
      <div id="leaflet-map" aria-label="Map"></div>

      <div class="map-controls-overlay">
        <button class="map-ctrl-btn" id="map-zoom-in" aria-label="Zoom in" data-tooltip="Zoom In">+</button>
        <button class="map-ctrl-btn" id="map-zoom-out" aria-label="Zoom out" data-tooltip="Zoom Out">−</button>
        <button class="map-ctrl-btn" id="map-reset" aria-label="Reset view" data-tooltip="Reset View">⌂</button>
      </div>

      <div class="map-stats-pill">
        <div class="map-stat"><strong>6</strong> Monasteries</div>
        <div class="map-stat"><strong>4</strong> Districts</div>
        <div class="map-stat"><strong>Sikkim</strong> India</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/main.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
